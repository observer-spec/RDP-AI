name: Windows RDP (Tailscale)

on:
  workflow_dispatch:
    inputs:
      rdp_pass:
        description: 'Optional override for RDP password (defaults to VNC_PASSWORD secret)'
        required: false
        default: ''
  schedule:
    - cron: '0 */5 * * *' # watchdog auto-respawn

concurrency:
  group: rdp-runner
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 360 # up to 6 hours max GitHub runner limit
    env:
      RDP_PASSWORD: ${{ github.event.inputs.rdp_pass || secrets.VNC_PASSWORD || 'Runner123456!' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Join Tailscale network
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Enable Windows Remote Desktop (RDP)
        shell: cmd
        run: |
          echo Enabling RDP in registry...
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
          
          echo Configuring Windows Firewall for RDP...
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
          
          echo Disabling password complexity policy...
          secedit /export /cfg C:\secpol.cfg
          powershell -Command "(Get-Content C:\secpol.cfg).replace('PasswordComplexity = 1', 'PasswordComplexity = 0').replace('MinimumPasswordLength = 8', 'MinimumPasswordLength = 0') | Out-File C:\secpol.cfg -Encoding ascii"
          secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY
          del /f /q C:\secpol.cfg
          
          echo Setting password for runneradmin...
          net user runneradmin %RDP_PASSWORD%
          echo Setting password done.

      - name: Announce Endpoints and Update README
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $maxAttempts = 15
          $tsIp = ""
          for ($i = 1; $i -le $maxAttempts; $i++) {
            try {
              $output = (tailscale ip -4 2>$null)
              if ($output -and $output.Trim() -ne "") {
                $tsIp = $output.Trim()
                break
              }
            } catch {}
            Write-Host "Waiting for Tailscale IP (attempt $i/$maxAttempts)..."
            Start-Sleep -Seconds 3
          }
          
          if (-not $tsIp) {
            Write-Host "::error::Could not obtain Tailscale IP"
            exit 1
          }
          
          Write-Host "================================================="
          Write-Host "🚀 WINDOWS REMOTE DESKTOP ONLINE"
          Write-Host "IP: $tsIp:3389"
          Write-Host "Username: runneradmin"
          Write-Host "================================================="
          
          $endpointMd = @"
# Active Windows RDP Endpoint (Tailscale)

Private to your tailnet. Active run on \`windows-latest\`.

- **RDP Address:** \`$tsIp:3389\`
- **Username:** \`runneradmin\`
- **Password:** Configured in \`VNC_PASSWORD\` secret (or dispatch input)
"@
          Set-Content -Path CURRENT_TAILSCALE_ENDPOINT.md -Value $endpointMd
          
          # Auto-update README live section
          $readme = Get-Content README.md -Raw
          $replacement = @"
<!-- LIVE_URLS_START -->
> **Current Run (Windows RDP, Tailscale):** \`$tsIp:3389\`
> *Login: \`runneradmin\` / password from \`VNC_PASSWORD\` secret*
<!-- LIVE_URLS_END -->
"@
          $readme = $readme -replace '(?s)<!-- LIVE_URLS_START -->.*?<!-- LIVE_URLS_END -->', $replacement
          Set-Content -Path README.md -Value $readme
          
          git config user.name "observer-spec"
          git config user.email "observer@amnuaysilpa.ac.th"
          git add CURRENT_TAILSCALE_ENDPOINT.md README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: update Windows RDP endpoint [skip ci]"
          git push origin main || Write-Host "Could not push update to git, continuing..."

      - name: Keep Alive (5h 30m)
        shell: pwsh
        run: |
          Write-Host "Keeping session alive for 5h 30m..."
          $totalSeconds = 19800
          $interval = 60
          $elapsed = 0
          while ($elapsed -lt $totalSeconds) {
            Start-Sleep -Seconds $interval
            $elapsed += $interval
            if ($elapsed % 600 -eq 0) {
              Write-Host "Alive: $($elapsed / 60) minutes elapsed..."
            }
          }
