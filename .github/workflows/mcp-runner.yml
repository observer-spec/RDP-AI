name: Cloudflare MCP Runner

on:
  workflow_dispatch:
    inputs:
      auth_token:
        description: 'Optional Auth Token/Secret for MCP access'
        required: false
        default: 'mcp-secret-key-123'

permissions:
  contents: write
  actions: write

jobs:
  run-mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Persistent State & Workspace
        uses: actions/cache/restore@v4
        with:
          path: workspace
          key: mcp-workspace-${{ github.run_id }}
          restore-keys: |
            mcp-workspace-

      - name: Initialize Workspace Directory
        run: |
          mkdir -p workspace

      - name: Install Desktop GUI, VNC Server & noVNC Web Client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb xfce4 xfce4-goodies x11vnc scrot imagemagick dbus-x11 novnc websockify
          
          # 1. Start Xvfb Virtual Desktop Buffer on :99 (1920x1080)
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          
          # 2. Launch XFCE4 Desktop Session on :99
          DISPLAY=:99 dbus-launch --exit-with-session startxfce4 &
          sleep 2
          
          # 3. Start x11vnc server on port 5900
          x11vnc -display :99 -nopw -forever -shared -bg -rfbport 5900
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Install Dependencies & Headless Browser
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic requests playwright psutil websockets
          python -m playwright install --with-deps chromium

      - name: Install Cloudflare Tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          rm cloudflared-linux-amd64.deb

      - name: Start MCP Server, Web VNC GUI & Tunnel
        env:
          AUTH_TOKEN: ${{ github.event.inputs.auth_token }}
          WORKSPACE_DIR: ${{ github.workspace }}/workspace
        run: |
          python server.py &
          sleep 3
          
          # Start cloudflared tunnel
          cloudflared tunnel --url http://127.0.0.1:8000 2>&1 | tee tunnel.log &
          
          echo "Waiting for tunnel to initialize..."
          for i in {1..30}; do
            TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]\+\.trycloudflare\.com' tunnel.log | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              echo "==============================================================="
              echo "☁️ WEB DESKTOP & MCP SERVER ONLINE!"
              echo "🔗 Interactive Web RDP Desktop: $TUNNEL_URL"
              echo "⚡ MCP Endpoint: $TUNNEL_URL/mcp"
              echo "🛠️ Tools Endpoint: $TUNNEL_URL/tools"
              echo "📁 Persistent Workspace: $WORKSPACE_DIR"
              echo "==============================================================="
              break
            fi
            sleep 1
          done
          
          # Keep alive loop (runs for 5 hours max before clean handoff)
          for tick in {1..60}; do
            echo "Runner tick $tick: $(date)"
            sleep 300
          done

      - name: Save Persistent State & Workspace Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: workspace
          key: mcp-workspace-${{ github.run_id }}-${{ github.run_attempt }}
