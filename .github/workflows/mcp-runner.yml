name: Cloudflare MCP Runner

on:
  workflow_dispatch:
    inputs:
      auth_token:
        description: 'Optional Auth Token/Secret for MCP access'
        required: false
        default: 'mcp-secret-key-123'

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  run-mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Persistent State & Workspace
        uses: actions/cache/restore@v4
        with:
          path: workspace
          key: mcp-workspace-${{ github.run_id }}
          restore-keys: |
            mcp-workspace-

      - name: Initialize Workspace Directory
        run: |
          mkdir -p workspace

      - name: Install Desktop GUI, Google Chrome & Standalone Firefox
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xfce4 xfce4-terminal xfce4-goodies dbus-x11 scrot openssl wget curl libu2f-udev libvulkan1 libgtk-3-0 libasound2t64 libdbus-glib-1-2

          # 1. Install Google Chrome (Official Deb)
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          rm google-chrome-stable_current_amd64.deb

          # 2. Install Official Mozilla Firefox Standalone (Bypasses snap completely)
          wget -q "https://download.mozilla.org/?product=firefox-latest-ssl&os=linux64&lang=en-US" -O firefox.tar.bz2
          sudo tar -xjf firefox.tar.bz2 -C /opt/
          sudo ln -sf /opt/firefox/firefox /usr/local/bin/firefox
          rm firefox.tar.bz2

          # 3. Create bulletproof wrapper for Chrome with --no-sandbox
          sudo tee /usr/local/bin/chrome-launcher << 'EOF'
          #!/bin/sh
          exec /usr/bin/google-chrome-stable --no-sandbox --disable-dev-shm-usage --disable-gpu --password-store=basic "$@"
          EOF
          sudo chmod +x /usr/local/bin/chrome-launcher

          # 4. Configure XFCE Default Browser & Mime Associations
          mkdir -p /home/runner/.config/xfce4
          mkdir -p /home/runner/.local/share/applications
          mkdir -p /home/runner/Desktop

          cat << 'EOF' > /home/runner/.config/xfce4/helpers.rc
          WebBrowser=custom-WebBrowser
          CustomWebBrowser=chrome-launcher
          EOF

          cat << 'EOF' > /home/runner/.config/mimeapps.list
          [Default Applications]
          text/html=google-chrome.desktop;firefox.desktop;
          x-scheme-handler/http=google-chrome.desktop;firefox.desktop;
          x-scheme-handler/https=google-chrome.desktop;firefox.desktop;
          EOF

          # 5. Place Working Desktop Shortcuts on the user's Desktop screen
          cat << 'EOF' > /home/runner/Desktop/Google-Chrome.desktop
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Google Chrome
          Comment=Access the Internet
          Exec=/usr/local/bin/chrome-launcher %U
          Icon=google-chrome
          Path=/home/runner
          Terminal=false
          StartupNotify=true
          Categories=Network;WebBrowser;
          EOF
          chmod +x /home/runner/Desktop/Google-Chrome.desktop

          cat << 'EOF' > /home/runner/Desktop/Firefox.desktop
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Firefox Browser
          Comment=Mozilla Firefox
          Exec=/usr/local/bin/firefox %U
          Icon=firefox
          Path=/home/runner
          Terminal=false
          StartupNotify=true
          Categories=Network;WebBrowser;
          EOF
          chmod +x /home/runner/Desktop/Firefox.desktop

          # Set system default alternatives
          sudo update-alternatives --install /usr/bin/x-www-browser x-www-browser /usr/local/bin/chrome-launcher 300
          sudo update-alternatives --set x-www-browser /usr/local/bin/chrome-launcher
          sudo update-alternatives --install /usr/bin/gnome-www-browser gnome-www-browser /usr/local/bin/chrome-launcher 300
          sudo update-alternatives --set gnome-www-browser /usr/local/bin/chrome-launcher

      - name: Install High-Performance KasmVNC (WebP/H.264 60FPS Streaming)
        run: |
          wget -q https://github.com/kasmtech/KasmVNC/releases/download/v1.5.0/kasmvncserver_noble_1.5.0_amd64.deb
          sudo apt-get install -y ./kasmvncserver_noble_1.5.0_amd64.deb
          rm kasmvncserver_noble_1.5.0_amd64.deb

          # Generate SSL certs for KasmVNC
          mkdir -p ~/.vnc
          touch ~/.Xauthority
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout /home/runner/.vnc/self.key -out /home/runner/.vnc/self.crt \
            -subj "/C=US/ST=State/L=City/O=Org/CN=kasmvnc"
          chmod 600 /home/runner/.vnc/self.key
          
          # Setup xstartup for XFCE4 session
          cat << 'EOF' > ~/.vnc/xstartup
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          dbus-launch --exit-with-session startxfce4 &
          EOF
          chmod +x ~/.vnc/xstartup

          # Setup password (runner / 123456)
          echo -e "123456\n123456\n" | kasmvncpasswd -u runner -o -w
          
          # Setup config
          cat << 'EOF' > ~/.vnc/kasmvnc.yaml
          network:
            ssl:
              require_ssl: false
              pem_certificate: /home/runner/.vnc/self.crt
              pem_key: /home/runner/.vnc/self.key
          desktop:
            resolution:
              width: 1920
              height: 1080
            allow_resize: true
          EOF

          # Start KasmVNC Server on Display :1
          vncserver :1 -select-de xfce -websocketPort 8443 -cert /home/runner/.vnc/self.crt -key /home/runner/.vnc/self.key
          echo "DISPLAY=:1" >> $GITHUB_ENV

      - name: Install Python MCP Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic requests playwright psutil
          python -m playwright install --with-deps chromium

      - name: Install Cloudflare Tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          rm cloudflared-linux-amd64.deb

      - name: Start MCP Server, Web VNC GUI & Tunnel
        env:
          AUTH_TOKEN: ${{ github.event.inputs.auth_token }}
          WORKSPACE_DIR: ${{ github.workspace }}/workspace
        run: |
          python server.py &
          sleep 3
          
          # Start Cloudflare Tunnel
          cloudflared tunnel --url http://127.0.0.1:8443 2>&1 | tee tunnel.log &
          
          echo "Waiting for tunnel to initialize..."
          for i in {1..30}; do
            TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]\+\.trycloudflare\.com' tunnel.log | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              echo "==============================================================="
              echo "⚡ KASMVNC 60FPS WEB DESKTOP IS ONLINE!"
              echo "🔗 Smooth Web Desktop URL: $TUNNEL_URL"
              echo "⚡ Login User: runner | Password: 123456"
              echo "⚡ MCP Server Endpoint: http://127.0.0.1:8000/mcp"
              echo "📁 Persistent Workspace: $WORKSPACE_DIR"
              echo "==============================================================="
              
              # Post live link into GitHub Job Summary
              echo "# ⚡ Live Cloud Desktop & MCP Server" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "- **Web Desktop URL:** [$TUNNEL_URL]($TUNNEL_URL)" >> $GITHUB_STEP_SUMMARY
              echo "- **Login Username:** \`runner\`" >> $GITHUB_STEP_SUMMARY
              echo "- **Login Password:** \`123456\`" >> $GITHUB_STEP_SUMMARY
              echo "- **Pre-installed Browsers:** Google Chrome & Mozilla Firefox (placed on Desktop)" >> $GITHUB_STEP_SUMMARY
              break
            fi
            sleep 1
          done
          
          # Keep alive loop (runs for 5 hours max before clean handoff)
          for tick in {1..60}; do
            echo "Runner tick $tick: $(date)"
            sleep 300
          done

      - name: Save Persistent State & Workspace Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: workspace
          key: mcp-workspace-${{ github.run_id }}-${{ github.run_attempt }}
