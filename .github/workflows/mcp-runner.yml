name: Cloudflare MCP Runner

on:
  workflow_dispatch:
    inputs:
      auth_token:
        description: 'Optional Auth Token/Secret for MCP access'
        required: false
        default: 'mcp-secret-key-123'

permissions:
  contents: write
  actions: write

jobs:
  run-mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Persistent State & Workspace
        uses: actions/cache/restore@v4
        with:
          path: workspace
          key: mcp-workspace-${{ github.run_id }}
          restore-keys: |
            mcp-workspace-

      - name: Initialize Workspace Directory
        run: |
          mkdir -p workspace

      - name: Install High-Performance TigerVNC & XFCE4 (Direct Xvnc Server)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y tigervnc-standalone-server tigervnc-common xfce4 xfce4-goodies novnc websockify scrot imagemagick dbus-x11
          
          # Setup xstartup for high performance TigerVNC session
          mkdir -p ~/.vnc
          cat << 'EOF' > ~/.vnc/xstartup
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          export XKL_XMODMAP_DISABLE=1
          export DISPLAY=:1
          [ -x /etc/vnc/xstartup ] && exec /etc/vnc/xstartup
          [ -r $HOME/.Xresources ] && xrdb $HOME/.Xresources
          dbus-launch --exit-with-session startxfce4 &
          EOF
          chmod +x ~/.vnc/xstartup

          # Start TigerVNC on display :1 (port 5901) with optimized 16-bit color & 1366x768 for low-latency streaming
          vncserver :1 -geometry 1366x768 -depth 16 -SecurityTypes None --I-KNOW-THIS-IS-INSECURE
          
          # Start websockify (port 6080 -> 5901)
          websockify --web /usr/share/novnc/ 6080 localhost:5901 &
          echo "DISPLAY=:1" >> $GITHUB_ENV

      - name: Install Dependencies & Headless Browser
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic requests playwright psutil
          python -m playwright install --with-deps chromium

      - name: Install Cloudflare Tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          rm cloudflared-linux-amd64.deb

      - name: Start MCP Server, Web VNC GUI & Tunnel
        env:
          AUTH_TOKEN: ${{ github.event.inputs.auth_token }}
          WORKSPACE_DIR: ${{ github.workspace }}/workspace
        run: |
          python server.py &
          sleep 3
          
          # Start cloudflared tunnel forwarding to websockify (port 6080)
          cloudflared tunnel --url http://127.0.0.1:6080 2>&1 | tee tunnel.log &
          
          echo "Waiting for tunnel to initialize..."
          for i in {1..30}; do
            TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]\+\.trycloudflare\.com' tunnel.log | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              echo "==============================================================="
              echo "⚡ HIGH-PERFORMANCE WEB DESKTOP (TigerVNC) ONLINE!"
              echo "🔗 Interactive Web RDP Desktop: $TUNNEL_URL/vnc.html?autoconnect=true&resize=scale&quality=8&compression=2"
              echo "⚡ MCP Endpoint: http://127.0.0.1:8000/mcp"
              echo "📁 Persistent Workspace: $WORKSPACE_DIR"
              echo "==============================================================="
              break
            fi
            sleep 1
          done
          
          # Keep alive loop (runs for 5 hours max before clean handoff)
          for tick in {1..60}; do
            echo "Runner tick $tick: $(date)"
            sleep 300
          done

      - name: Save Persistent State & Workspace Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: workspace
          key: mcp-workspace-${{ github.run_id }}-${{ github.run_attempt }}
