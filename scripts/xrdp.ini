; RDP-AI: minimal xrdp config.
; RDP sessions attach to the local KasmVNC display (:1 -> 127.0.0.1:5901),
; so mstsc and the browser share one screen. No sesman needed.
[Globals]
ini_version=1
fork=true
port=3389
use_vsock=false
tcp_nodelay=true
tcp_keepalive=true
security_layer=negotiate
crypt_level=high
ssl_protocols=TLSv1.2, TLSv1.3
autorun=
allow_channels=true
max_bpp=32
new_cursors=true
use_fastpath=both

[Logging]
LogFile=xrdp.log
LogLevel=ERROR
EnableSyslog=true
SyslogLevel=ERROR

[Xvnc]
name=Desktop
lib=libvnc.so
username=ask
password=ask
ip=127.0.0.1
port=5901
